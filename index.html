<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="left-signup">
      <img
        id="plant-background"
        src="img/plant-background.jpg"
        alt="Photo of leafy plant by Halie West"
      />
      <div class="signup-banner">
        <img src="img/odin-lined.png" alt="Odin Project logo" height="100%" />
        Odin
      </div>
      <span id="banner-credits"
        >Photo by
        <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
        <a href="https://unsplash.com">Unsplash</a></span
      >
    </div>
    <div>
      <p>
        This is not a real online service! You know you need something like this
        in your life to help you realize your deepest dreams. Sign up
        <em>now</em> to get started.
      </p>
      <p>You <em>know</em> you want to.</p>
      <form action="">
        <h2>Let's do this!</h2>
        <div>
          <label for="first-name">FIRST NAME</label
          ><input type="text" id="first-name" />
        </div>
        <div>
          <label for="last-name">LAST NAME</label
          ><input type="text" id="last-name" />
        </div>
        <div>
          <label for="email">EMAIL</label><input type="text" id="email" />
        </div>
        <div>
          <label for="phone-num">PHONE NUMBER</label
          ><input type="text" id="phone-num" />
        </div>
        <div>
          <label for="password">PASSWORD</label
          ><input type="text" id="password" />
        </div>
        <div>
          <label for="confirm-pass">CONFIRM PASSWORD</label
          ><input type="text" id="confirm-pass" />
        </div>
        <button>Create Account</button>
        <span>Already have an account? <a href="#">Log in</a></span>
      </form>
    </div>
  </body>
</html>
